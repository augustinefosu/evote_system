<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — University E-Voting</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="topbar">
  <div class="brand"><div class="crest" aria-hidden="true">UE</div><div>UNIVERSITY E-VOTING SYSTEM</div></div>
  <nav class="nav" id="nav" aria-label="Main"></nav>
</header>

<main class="container" id="main">
  <form class="card auth" id="register-form" style="max-width:560px" novalidate>
    <h2>Create Student Account</h2>
    <div id="msg" style="display:none"></div>
    <div class="field">
      <label for="name">Full name <span class="req" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
      <input id="name" name="name" required autocomplete="name">
    </div>
    <div class="grid two">
      <div class="field">
        <label for="student_id">Student ID <span class="req" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
        <input id="student_id" name="student_id" required placeholder="UEN0012023" autocomplete="off">
      </div>
      <div class="field">
        <label for="email">Email address <span class="req" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
    </div>
    <div class="grid three">
      <div class="field"><label for="faculty">Faculty</label><input id="faculty" name="faculty"></div>
      <div class="field"><label for="department">Department</label><input id="department" name="department"></div>
      <div class="field"><label for="level">Level</label><input id="level" name="level" placeholder="100 / 200 / 300 / 400"></div>
    </div>
    <div class="field">
      <label for="password">Password <span class="req" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"
        aria-describedby="password-hint">
      <p class="hint" id="password-hint">At least 8 characters.</p>
    </div>
    <button type="submit" class="btn" style="width:100%">Register</button>
    <p class="meta" style="margin-bottom:0">Already have an account? <a href="/login.html">Login</a></p>
  </form>
</main>

<script src="/js/api.js"></script>
<script src="/js/pages/register.js"></script>
</body>
</html>
