# Netlify configuration.
#
# The static frontend is served from public/, and /api/* is rewritten to the
# Express app running as a Netlify Function (netlify/functions/api.js).
# Supabase provides the database, auth and object storage.

[build]
  command = "npm ci"
  publish = "public"

# Secrets-scanning controls must be build environment variables; Netlify
# ignores them as plain [build] keys.
[build.environment]
  # NODE_ENV, SUPABASE_DB_SSL and SUPABASE_STORAGE_BUCKET are configuration,
  # not credentials, but their values ("production", "no-verify",
  # "candidate-photos") legitimately appear in source, tests, the docs and the
  # bundled functions, so Netlify's secrets scanner flags them and fails the
  # build. Omit those non-secret keys; everything else stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,SUPABASE_DB_SSL,SUPABASE_STORAGE_BUCKET,APP_URL,TRUST_PROXY"
  # The documentation and sample-config files only ever contain placeholder or
  # example values (never a real credential), yet their examples match live
  # deployment settings and trip the scanner. Exclude them from scanning.
  SECRETS_SCAN_OMIT_PATHS = ".env.example,README.md,render.yaml"

[functions]
  # express and pg-native are left unbundled: express bundles poorly, and `pg`
  # optionally requires the native pg-native addon inside a try/catch.
  external_node_modules = ["express", "pg-native"]
  node_bundler = "esbuild"

# Scheduled auto-close of elections whose end time has passed. The long-lived
# server runs this on an interval; here Netlify invokes the `scheduler` function
# on the cron below. Keep the cadence at or above the free-plan minimum.
[functions."scheduler"]
  schedule = "*/5 * * * *"

# Route the API to the Express function. The function normalizes the path, so it
# works whether it receives /api/... or the internal /.netlify/functions/... one.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Security headers for the statically served pages, mirroring what helmet sets
# on API responses in src/server.js. img-src allows Supabase Storage for
# candidate photos (https://<ref>.supabase.co).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
